name: Publish

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Scaffold smoke test (sqlite)
        run: bun run src/cli.ts ci-smoke --no-install --no-git --no-security

      - name: Verify scaffold structure
        run: |
          test -f ci-smoke/apps/api/src/index.ts
          test -f ci-smoke/apps/web/src/App.tsx
          test -f ci-smoke/packages/db/src/schema.ts
          test -f ci-smoke/packages/db/src/client.ts
          test -f ci-smoke/scripts/dev.ts
          test -f ci-smoke/scripts/check-ports.ts
          test -f ci-smoke/vitest.config.ts
          test -f ci-smoke/turbo.json

      - name: Scaffold smoke test (no database)
        run: bun run src/cli.ts ci-smoke-nodb --db none --no-install --no-git --no-security

      - name: Verify no-db env
        run: grep -q 'DB_ENABLED=false' ci-smoke-nodb/.env

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (OIDC trusted publishing requires npm 11.5.1+)
        run: npm install -g npm@11

      - name: Verify package version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "Tag version: $TAG"
          echo "package.json: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish to npm (OIDC trusted publisher)
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: npm publish --provenance --access public

      - name: Publish to npm (NPM_TOKEN fallback)
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
