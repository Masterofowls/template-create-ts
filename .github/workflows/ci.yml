name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build CLI
        run: bun run build

      - name: Scaffold smoke test
        run: bun run dev -- ci-smoke --no-install --no-git --no-security

      - name: Verify scaffold structure
        run: |
          test -f ci-smoke/apps/api/src/index.ts
          test -f ci-smoke/apps/web/src/App.tsx
          test -f ci-smoke/packages/db/src/schema.ts
          test -f ci-smoke/vitest.config.ts
          test -f ci-smoke/turbo.json

      - name: Security quick audit
        working-directory: ci-smoke
        run: |
          bun install --frozen-lockfile
          bun run security:quick || true
